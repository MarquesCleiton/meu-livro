<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aviso de Entrega • Protocolo Bluehand: Alienígenas</title>
  
  <!-- SEO & Meta Tags -->
  <meta name="description" content="Você recebeu esta entrega por engano? Entre em contato diretamente com Cleiton M.">
  <meta property="og:title" content="Você recebeu essa entrega por mim? • Cleiton M.">
  <meta property="og:description" content="Aviso de entrega do livro Protocolo Bluehand: Alienígenas. Por favor, entre em contato!">
  <meta property="og:image" content="assets/livro.png">

  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Decorações de Cantos Fluidos (Proporcionais e responsivos) -->
  <div class="corner-shape corner-top-left" aria-hidden="true">
    <svg viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M-20 -20 L140 -20 C110 60, 40 120, -20 140 Z" fill="#0C1D13"/>
      <path d="M-20 40 C20 60, 80 100, 60 170 L15 170 C-10 120, -20 90, -20 40 Z" fill="#38E54D"/>
    </svg>
  </div>

  <div class="corner-shape corner-bottom-right" aria-hidden="true">
    <svg viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M260 200 L100 200 C130 120, 200 50, 260 30 Z" fill="#0C1D13"/>
      <path d="M260 130 C220 110, 160 70, 180 0 L230 0 C250 50, 260 80, 260 130 Z" fill="#38E54D"/>
    </svg>
  </div>

  <!-- CONTAINER PRINCIPAL: CABE NA TELA SEM SCROLL -->
  <div class="page-container">
    
    <!-- Cabeçalho Compacto -->
    <header class="hero-header">
      <div class="doodle-bursts left" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <div class="title-container">
        <h1 class="main-title">
          <span class="title-top">VOCÊ RECEBEU</span>
          <span class="brush-badge">ESSA ENTREGA</span>
          <span class="title-bottom">POR MIM?</span>
        </h1>
      </div>

      <div class="doodle-bursts right" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </header>

    <!-- Card Central Compacto -->
    <main class="flyer-card">
      
      <div class="flyer-content-row">
        <!-- Imagem do Livro Compacta -->
        <div class="book-box">
          <img src="assets/livro.png" alt="Livro Protocolo Bluehand: Alienígenas" class="book-img">
        </div>

        <!-- Dados do Livro e Destinatário -->
        <div class="details-box">
          <div class="info-pill-item">
            <span class="pill-tag">Livro:</span>
            <strong class="pill-title">Protocolo Bluehand: Alienígenas</strong>
          </div>

          <div class="info-pill-item">
            <span class="pill-tag">Destinatário:</span>
            <strong class="pill-title">Cleiton M.</strong>
          </div>

          <div class="contact-prompt-wrap">
            <span class="contact-prompt">Favor entrar em contato!</span>
            <div class="doodle-underline"></div>
          </div>
        </div>
      </div>

      <!-- Botão do Instagram Oficial -->
      <a href="https://www.instagram.com/cleiton.rua.independencia/" target="_blank" rel="noopener noreferrer" class="instagram-btn">
        <div class="insta-icon-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </div>
        <div class="insta-info">
          <span class="insta-sub">Instagram Oficial:</span>
          <span class="insta-username">@cleiton.rua.independencia</span>
        </div>
        <span class="insta-arrow">→</span>
      </a>

      <!-- Botão Central de Ação Rápida (Abre o Chat) -->
      <button type="button" id="btnOpenChatFromCard" class="primary-chat-trigger-btn">
        <span class="trigger-icon">💬</span>
        <span class="trigger-text">Mandar Mensagem Direta</span>
        <span class="trigger-badge" id="cardChatBadge">Online</span>
      </button>

    </main>

    <!-- Rodapé Compacto -->
    <footer class="hero-footer">
      <div class="thanks-row">
        <div class="doodle-bursts-small" aria-hidden="true">
          <span></span><span></span>
        </div>
        <span class="thanks-text">Obrigado!</span>
        <div class="doodle-bursts-small" aria-hidden="true">
          <span></span><span></span>
        </div>
      </div>
      <a href="admin.html" class="admin-discreet-link" title="Acesso Administrativo">🔒</a>
    </footer>

  </div>

  <!-- ========================================================================
       BALÃO FLUTUANTE DE CHAT (FAB - FLOATING ACTION BUTTON)
       ======================================================================== -->
  <div class="floating-chat-container">
    <button type="button" id="floatingChatBtn" class="floating-chat-btn" aria-label="Abrir conversa com Cleiton">
      <span class="floating-icon">💬</span>
      <span class="floating-label">Falar com Cleiton</span>
      <span class="floating-online-dot"></span>
    </button>
  </div>

  <!-- ========================================================================
       DRAWER / MODAL FLUTUANTE DO CHAT
       ======================================================================== -->
  <div id="chatDrawerBackdrop" class="chat-drawer-backdrop hidden"></div>
  
  <aside id="chatDrawer" class="chat-drawer hidden" aria-label="Janela de conversa">
    <!-- Topbar do Chat Drawer -->
    <div class="drawer-header">
      <div class="drawer-profile">
        <div class="cleiton-avatar-circle">CM</div>
        <div class="drawer-profile-info">
          <div class="profile-name-row">
            <h4>Cleiton M.</h4>
            <span class="verified-check">✓</span>
          </div>
          <span class="profile-status">Online agora</span>
        </div>
      </div>
      <button type="button" id="btnCloseChatDrawer" class="btn-close-drawer" aria-label="Fechar chat">✕</button>
    </div>

    <!-- Conteúdo do Drawer -->
    <div class="drawer-body">
      
      <!-- ESTADO 1: FORMULÁRIO DE PRIMEIRO CONTATO -->
      <div id="contactFormContainer" class="drawer-view">
        <div class="view-intro">
          <h5>Envie seu recado</h5>
          <p>Mande uma mensagem direta e conversaremos aqui mesmo.</p>
        </div>

        <form id="contactForm" class="compact-form" novalidate>
          <div class="input-block">
            <label for="inputName">Seu Nome:</label>
            <input type="text" id="inputName" name="nome" placeholder="Como posso te chamar?" required autocomplete="name">
          </div>

          <div class="input-block">
            <label for="inputPhone">Seu WhatsApp / Telefone:</label>
            <input type="tel" id="inputPhone" name="contato" placeholder="(XX) XXXXX-XXXX" required autocomplete="tel">
          </div>

          <div class="input-block">
            <label for="inputMessage">Sua Mensagem:</label>
            <textarea id="inputMessage" name="mensagem" rows="3" placeholder="Ex: Olá Cleiton, recebi seu livro..." required></textarea>
          </div>

          <button type="submit" id="btnSubmitForm" class="drawer-submit-btn">
            <span class="btn-text">Enviar Mensagem</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>

      <!-- ESTADO 2: TELA DE CHAT ATIVO -->
      <div id="chatViewContainer" class="drawer-view hidden">
        <div class="chat-messages-container" id="chatMessages" role="log" aria-live="polite">
          <!-- Mensagens geradas via script.js -->
        </div>

        <form id="chatQuickForm" class="drawer-input-bar">
          <input type="text" id="chatQuickInput" placeholder="Digite uma mensagem..." autocomplete="off" required>
          <button type="submit" id="chatQuickSendBtn" class="drawer-send-btn" title="Enviar Mensagem">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>

    </div>
  </aside>

  <!-- Notificação Toast -->
  <div id="toastNotification" class="toast-popup" role="alert" aria-live="assertive"></div>

  <script src="script.js"></script>
</body>
</html>
